name: Compilar Estude com Alessa em EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compilar EXE
        run: |
          pyinstaller --onefile --windowed --name "EstudeComAlessa" src/main.py
      - name: Enviar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: EstudeComAlessa-Windows-EXE
          path: dist/EstudeComAlessa.exe
